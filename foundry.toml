[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# The Cash/Note vault's creation bytecode sits within ~1KB of the EIP-170 ceiling, and the legacy
# codegen pipeline could no longer fit the final-redemption path added on 2026-08-25. via_ir
# recovers roughly 10% of the vault deployers' size. Note this changes every contract's bytecode
# relative to the legacy pipeline the 2026-08-17 audit reviewed.
via_ir = true
fs_permissions = [{ access = "read-write", path = "./"}]
